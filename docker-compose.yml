services:
  portal:
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
    container_name: halcyon-god-portal
    environment:
      - CTF_SECRET=${CTF_SECRET}
    ports:
      - "8008:5000"
    networks:
      - public-net
      - internal-net

  waystation:
    build:
      context: .
      dockerfile: docker/waystation/Dockerfile
    container_name: halcyon-god-waystation
    environment:
      - CTF_SECRET=${CTF_SECRET}
    # No published ports -- internal-only, reachable only via the pivot.
    networks:
      - internal-net

  vault:
    build:
      context: .
      dockerfile: docker/vault/Dockerfile
    container_name: halcyon-god-vault
    environment:
      - CTF_SECRET=${CTF_SECRET}
    # No published ports -- internal-only, reachable only via the pivot.
    networks:
      - internal-net

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
