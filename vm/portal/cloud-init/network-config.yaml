# Explicit network-config for the NoCloud datasource. Matched by name,
# not MAC -- see the single-host boxes' own network-config.yaml for
# why. Chain topology: portal only needs a link to waystation (its
# SSRF never targets vault directly -- that pivot happens FROM
# waystation's own RCE, not from portal). 2 NICs: NAT, link to
# waystation.
version: 2
ethernets:
  nat:
    match:
      name: "enp0s2"
    dhcp4: true
    dhcp6: true
  link-waystation:
    match:
      name: "enp0s3"
    dhcp4: false
    addresses:
      - 10.10.40.1/24
