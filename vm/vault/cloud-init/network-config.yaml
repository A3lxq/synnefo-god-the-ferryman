# See portal's network-config.yaml for the chain-topology rationale.
# Vault only needs a link to waystation (the one host that pivots to
# it) -- never a direct link to portal.
version: 2
ethernets:
  nat:
    match:
      name: "enp0s2"
    dhcp4: true
    dhcp6: true
  link-waystation:
    match:
      name: "enp0s3"
    dhcp4: false
    addresses:
      - 10.10.60.2/24
