# See portal's network-config.yaml for the chain-topology rationale.
# Waystation is the middle host: NAT (build-only), a link back to
# portal, and a second link on to vault -- its own RCE is what
# pivots further to vault, so IT needs the connectivity, not portal.
version: 2
ethernets:
  nat:
    match:
      name: "enp0s2"
    dhcp4: true
    dhcp6: true
  link-portal:
    match:
      name: "enp0s3"
    dhcp4: false
    addresses:
      - 10.10.40.2/24
  link-vault:
    match:
      name: "enp0s4"
    dhcp4: false
    addresses:
      - 10.10.60.1/24
